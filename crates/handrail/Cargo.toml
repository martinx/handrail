[package]
name = "handrail"
version = "0.1.0"
description = "Policy packs for coding agents: enforced where the agent allows it, honest where it doesn't."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ai-agents", "coding-agent", "security", "policy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
handrail-core = { path = "../handrail-core" }
handrail-claude = { path = "../handrail-claude" }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
