name: release

# Tag a version (git tag v0.1.0 && git push origin v0.1.0) to build and publish binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # build-provenance attestation (Sigstore, no stored keys)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: tag matches the crate version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -m1 '^version' crates/handrail/Cargo.toml | cut -d'"' -f2)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME does not match crate version $have"; exit 1; }
      - run: cargo test --all --locked
        if: matrix.target != 'x86_64-apple-darwin'   # same runner as the aarch64 job, which already ran them
      - run: cargo build --release --locked --target ${{ matrix.target }} -p handrail
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/handrail dist/handrail
          tar -C dist -czf handrail-${{ matrix.target }}.tar.gz handrail
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: handrail-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: handrail-${{ matrix.target }}
          path: handrail-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: cd artifacts && sha256sum handrail-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install or upgrade:"
            echo
            echo '    curl -fsSL https://handrail.bitey.ai/install.sh | sh'
            echo
            echo "Every archive has a build-provenance attestation. To verify one:"
            echo
            echo "    gh attestation verify handrail-<target>.tar.gz --repo $GITHUB_REPOSITORY"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "Handrail $GITHUB_REF_NAME" --notes-file notes.md
