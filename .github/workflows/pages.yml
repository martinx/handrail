name: pages

# The website is built from site/src and the catalog compiled into the binary, so the
# pack list on the site always matches what handrail installs.
on:
  push:
    branches: [main]
    paths: ["site/**", "catalog/**", "crates/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked -p handrail
      - run: ./target/debug/handrail __catalog-json > catalog.json
      - run: python3 site/build.py catalog.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
