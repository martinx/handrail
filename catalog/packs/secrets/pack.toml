id = "secrets"
version = "1.0.0"
category = "security"
tier = "enforced"
title = "Credentials and secret files"
summary = "Stop Claude's own file tools from reading or editing SSH keys, cloud credentials, .env files and private keys."
protects = [
  "~/.ssh, ~/.aws, ~/.gnupg, ~/.kube, ~/.docker, ~/.netrc, cloud CLI credentials",
  ".env, *.pem and *.key files in projects",
  "macOS keychain files",
]
tradeoffs = [
  "You edit .env files yourself",
  "Legitimate *.key files in a project are blocked too",
]
limits = "Covers Claude's built-in file tools and the file commands it recognizes in Bash (cat, head, sed, ...). A Python script that opens a file itself is not covered. For OS-level blocking, add 80-sandbox."

[targets.claude-code]
enforcement = "partial"
settings = "claude-code/settings.json"
