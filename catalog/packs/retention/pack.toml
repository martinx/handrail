id = "retention"
version = "1.0.0"
category = "privacy"
tier = "enforced"
title = "Keep local transcripts 7 days"
summary = "Session transcripts are stored in plaintext under ~/.claude/projects/ for 30 days by default. Reduce that to 7 days."
protects = [
  "Passwords and customer data that appeared in a conversation lingering on disk",
  "Exposure if the machine is lost or someone else logs in",
]
tradeoffs = [
  "Sessions older than 7 days can no longer be resumed",
]
limits = "Does not delete copies already taken by backups or cloud sync. Also enable full-disk encryption and exclude ~/.claude from cloud sync."

[targets.claude-code]
enforcement = "enforced"
settings = "claude-code/settings.json"
