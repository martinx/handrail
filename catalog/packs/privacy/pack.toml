id = "privacy"
version = "1.0.0"
category = "privacy"
tier = "enforced"
title = "Keep data on this machine"
summary = "Turn off every optional upload: Remote Control, cloud agents, hosted artifacts, claude.ai connectors, telemetry, error reports, feedback and transcript uploads."
protects = [
  "Sessions synced to the cloud",
  "Output published to claude.ai",
  "Feedback reports that attach the whole conversation and code",
  "Telemetry and error reports",
]
tradeoffs = [
  "No Remote Control from your phone",
  "The Artifact tool and claude.ai connectors (Gmail, Drive, ...) are unavailable",
  "/feedback, /bug and /share are unavailable",
]
limits = "Model inference itself must send the conversation to the model API. No local setting can change that. See the README section 'Limits'."

[targets.claude-code]
enforcement = "enforced"
min_version = "2.1.242"
settings = "claude-code/settings.json"
hooks = [
  "claude-code/hooks/guard.sh",
]
